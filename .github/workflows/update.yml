# Cập nhật dữ liệu hằng tuần.
#
# Chạy ở repo công khai này (Actions miễn phí). Code crawl nằm ở repo riêng tư, được lấy về lúc chạy bằng
# secret SRC_REPO_TOKEN (fine-grained token: repo mittohoa/toidi-project, Contents: Read and write).
# Log ở đây ai cũng xem được -> chi tiết crawl được ghi ra file tạm, không in ra; chỉ in tóm tắt thay đổi.
# Lỗi ở bất kỳ bước nào -> workflow đỏ, GitHub gửi email cho chủ repo, KHÔNG phát hành gì.

name: Cập nhật dữ liệu

on:
  schedule:
    - cron: "0 20 * * 0" # 20:00 UTC Chủ nhật = 03:00 thứ Hai giờ VN
  workflow_dispatch:
    inputs:
      full:
        description: "Build lại cả bản đồ nền + chỉ mục địa điểm"
        type: boolean
        default: false
      force:
        description: "Phát hành dù kiểm tra an toàn không đạt (đã xem tay)"
        type: boolean
        default: false

permissions:
  contents: write # tạo Release + cập nhật STATUS.md ở repo này

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      LOG: /tmp/log
    steps:
      - uses: actions/checkout@v4
        with:
          path: pub

      - uses: actions/checkout@v4
        with:
          repository: mittohoa/toidi-project
          token: ${{ secrets.SRC_REPO_TOKEN }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Crawl + dựng + kiểm tra
        working-directory: src
        run: |
          mkdir -p "$LOG"
          full=false
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%d)" -le 7 ]; then full=true; fi
          if [ "$full" = "true" ]; then
            curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
              | tar xz -C /usr/local/bin pmtiles
          fi
          step() { # chạy lặng lẽ; lỗi thì chỉ báo tên bước (log chi tiết không công khai)
            echo "::group::$1"
            if ! "${@:2}" > "$LOG/$(echo "$1" | tr ' /' '__').log" 2>&1; then echo "::error::Bước '$1' lỗi"; exit 1; fi
            echo "xong"; echo "::endgroup::"
          }
          # bước chỉ dựa vào OpenStreetMap (Overpass hay quá tải khi gọi từ GitHub): lỗi thì cảnh báo và
          # dùng lại dữ liệu lần trước (file trong repo), không làm hỏng cả đợt cập nhật
          soft() {
            echo "::group::$1"
            if ! "${@:2}" > "$LOG/$(echo "$1" | tr ' /' '__').log" 2>&1; then
              echo "::warning::Bước '$1' không xong (Overpass?) — dùng dữ liệu lần trước"
            else echo "xong"; fi
            echo "::endgroup::"
          }
          cp data/bus-network.json.gz /tmp/hcm-old.json.gz
          # Nguồn TPHCM chặn IP nước ngoài (HTTP 403 từ máy chủ GitHub) -> TPHCM được crawl trên máy ở VN
          # (tools/update_data.sh --hcm-only) rồi đẩy lên repo riêng tư; ở đây thử, không được thì dùng bản đó.
          if python tools/crawl_hcm.py > "$LOG/crawl_hcm.log" 2>&1; then
            echo "crawl TPHCM: xong"
          else
            echo "::warning::Không crawl được TPHCM từ máy chủ GitHub — dùng dữ liệu TPHCM mới nhất trong repo riêng tư"
          fi
          step "crawl Ha Noi" python tools/crawl_hanoi.py
          soft "metro Ha Noi" python tools/fetch_hanoi_metro.py
          step "GTFS TPHCM" python tools/build_gtfs_hcm.py
          step "GTFS Ha Noi" python tools/build_gtfs_hanoi.py
          curl -sL -o /tmp/validator.jar https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
          for c in hcm hanoi; do
            step "validator $c" java -jar /tmp/validator.jar -i data/gtfs/$c.zip -o /tmp/report-$c -c vn
            python -c "
          import json, sys
          r = json.load(open('/tmp/report-$c/report.json'))
          errs = [(n['code'], n['totalNotices']) for n in r['notices'] if n['severity'] == 'ERROR']
          print('GTFS $c:', errs or 'không có lỗi'); sys.exit(1 if errs else 0)"
          done
          step "goi du lieu TPHCM" python tools/build_app_data.py data/gtfs/hcm.zip hcm "TP. Hồ Chí Minh"
          step "goi du lieu Ha Noi" python tools/build_app_data.py data/gtfs/hanoi.zip hanoi "Hà Nội"
          # gói tải thêm (tools/cities.py PACKS), nguồn OpenStreetMap — không đạt kiểm tra chất lượng
          # (tools/build_gtfs_osm.py thoát mã 2) thì giữ gói đã phát hành, không chặn TPHCM / Hà Nội
          if python tools/build_gtfs_osm.py danang > "$LOG/osm_danang.log" 2>&1; then
            step "goi du lieu Da Nang" python tools/build_app_data.py data/gtfs/danang.zip danang "Đà Nẵng"
          else
            echo "::warning::Đà Nẵng: dữ liệu OSM chưa đạt kiểm tra chất lượng — tuần này giữ gói cũ"
          fi
          if [ "$full" = "true" ]; then
            step "ban do nen" bash tools/extract_maps.sh
            soft "dia diem TPHCM" python tools/build_places.py hcm
            soft "dia diem Ha Noi" python tools/build_places.py hanoi
            soft "dia diem Da Nang" python tools/build_places.py danang
          fi

      - name: So sánh + kiểm tra an toàn
        id: publish
        working-directory: src
        run: |
          set +e
          python tools/publish_data.py /tmp/release \
            --previous https://github.com/mittohoa/toidi-data/releases/latest/download/manifest.json \
            ${{ inputs.force && '--force' || '' }} > "$LOG/publish.log" 2>&1
          code=$?
          set -e
          grep -E "^(#|- |KIỂM TRA|  [a-z]+:)" "$LOG/publish.log" || true  # tóm tắt + lý do chặn (không có chi tiết nguồn)
          if [ $code -eq 3 ]; then echo "release=false" >> "$GITHUB_OUTPUT"; echo "Không có gì mới."; exit 0; fi
          [ $code -eq 0 ] || exit $code
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$(python -c "import json;print(json.load(open('/tmp/release/manifest.json'))['tag'])")" >> "$GITHUB_OUTPUT"

      - name: Phát hành
        if: steps.publish.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/release
          tag="${{ steps.publish.outputs.tag }}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          # base_url trong manifest trỏ theo tag gốc -> sửa lại nếu phải thêm hậu tố
          python - "$tag" <<'EOF'
          import json, sys
          m = json.load(open("manifest.json", encoding="utf-8"))
          old = m["base_url"]; new = old.rsplit("/", 2)[0] + "/" + sys.argv[1] + "/"
          m["tag"] = sys.argv[1]
          s = json.dumps(m, ensure_ascii=False, indent=1).replace(old, new)
          open("manifest.json", "w", encoding="utf-8").write(s)
          EOF
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Dữ liệu $(date +%d/%m/%Y)" --notes-file CHANGES.md \
            manifest.json $(ls *.json.gz *.pmtiles 2>/dev/null)

      - name: Lưu dữ liệu thô + nhật ký vào repo riêng tư
        if: steps.publish.outputs.release == 'true'
        working-directory: src
        run: |
          python tools/diff_hcm.py /tmp/hcm-old.json.gz > /tmp/diff.md 2> /dev/null || true
          { head -3 data/CHANGELOG.md; cat /tmp/diff.md; echo; tail -n +4 data/CHANGELOG.md; } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md data/CHANGELOG.md
          git config user.name "toidi-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ app/assets/transit/ app/assets/places/
          git commit -q -m "data: cập nhật dữ liệu ${{ steps.publish.outputs.tag }}" || echo "không có gì để commit"
          git push -q

      - name: Cập nhật STATUS.md (trang trạng thái + giữ lịch chạy không bị GitHub tắt sau 60 ngày)
        if: always()
        working-directory: pub
        run: |
          python - <<'EOF'
          import json, urllib.request, datetime
          try:
              m = json.load(urllib.request.urlopen("https://github.com/mittohoa/toidi-data/releases/latest/download/manifest.json"))
              rows = "\n".join("| %s | %s | %s | %s |" % (c["name"], c["data_date"], c["routes"], c["stops"]) for c in m["cities"].values())
              latest = m["tag"]
          except Exception:
              rows, latest = "| — | — | — | — |", "?"
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=7))).strftime("%d/%m/%Y %H:%M")
          open("STATUS.md", "w", encoding="utf-8").write(
              "# Trạng thái dữ liệu\n\nKiểm tra lần cuối: **%s** (giờ VN) — kết quả: **${{ job.status }}**\n\n"
              "Bản phát hành mới nhất: `%s`\n\n| Thành phố | Ngày dữ liệu | Tuyến | Trạm |\n|---|---|---|---|\n%s\n" % (now, latest, rows))
          EOF
          git config user.name "toidi-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -q -m "status: $(date -u +%Y-%m-%d)" || exit 0
          git push -q
